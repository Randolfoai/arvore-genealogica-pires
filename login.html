<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acesso — Família Pires</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9E4D6; --surface:#FDFBF5; --surface-2:#FFFFFF;
  --ink:#2B2620; --ink-2:#6B6255; --ink-muted:#948B7A;
  --accent:#2F5D50; --accent-bg:#E4ECE8;
  --border:#C9C0AC;
  --font-serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --font-sans:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B17; --surface:#221F1A; --surface-2:#2A2620;
    --ink:#EDE7D6; --ink-2:#B3AA95; --ink-muted:#837A69;
    --accent:#5FA793; --accent-bg:#233129;
    --border:#3A3730;
  }
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-sans); margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem;}
.box{background:var(--surface-2); border:.5px solid var(--border); border-radius:14px; padding:2.5rem; max-width:500px; width:100%;}
.logo{text-align:center; margin-bottom:2rem; font-size:3rem;}
.title{font-family:var(--font-serif); font-size:24px; font-weight:600; text-align:center; margin:0 0 .5rem;}
.content{font-size:15px; color:var(--ink-2); line-height:1.8; margin:2rem 0;}
.btn{display:inline-block; width:100%; padding:1rem; background:var(--accent); color:var(--bg); border:none; border-radius:6px; font-family:var(--font-sans); font-size:16px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; transition:opacity 0.2s; margin-top:1rem;}
.btn:hover{opacity:0.9;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🔓</div>
  <h1 class="title">Acesso Livre</h1>
  <div class="content">
    <p>O sistema de autenticação foi removido. A árvore genealógica da Família Pires agora é de acesso livre para todos.</p>
    <p>Clique no botão abaixo para acessar a genealogia completa.</p>
  </div>
  <a href="index.html" class="btn">Acessar Genealogia</a>
</div>
</body>
</html>
