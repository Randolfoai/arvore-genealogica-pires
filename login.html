<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acesso — Família Pires</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0"
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9E4D6; --surface:#FDFBF5; --surface-2:#FFFFFF;
  --ink:#2B2620; --ink-2:#6B6255; --ink-muted:#948B7A;
  --accent:#2F5D50; --accent-bg:#E4ECE8;
  --ok:#3B6D11;
  --border:#C9C0AC;
  --font-serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --font-sans:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B17; --surface:#221F1A; --surface-2:#2A2620;
    --ink:#EDE7D6; --ink-2:#B3AA95; --ink-muted:#837A69;
    --accent:#5FA793; --accent-bg:#233129;
    --ok:#8FBF5A;
    --border:#3A3730;
  }
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-sans); margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem;}
.login-box{background:var(--surface-2); border:.5px solid var(--border); border-radius:14px; padding:2.5rem; max-width:420px; width:100%;}
.logo{text-align:center; margin-bottom:2rem; font-size:3rem;}
.title{font-family:var(--font-serif); font-size:24px; font-weight:600; text-align:center; margin:0 0 .5rem;}
.subtitle{font-size:14px; color:var(--ink-2); text-align:center; margin:0 0 2rem; line-height:1.6;}
.form-group{margin-bottom:1.2rem;}
.label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin-bottom:.5rem;}
.input{width:100%; padding:.75rem; border:1px solid var(--border); border-radius:6px; font-family:var(--font-sans); font-size:15px; background:var(--bg); color:var(--ink); transition:border-color 0.2s;}
.input:focus{outline:none; border-color:var(--accent);}
.select{width:100%; padding:.75rem; border:1px solid var(--border); border-radius:6px; font-family:var(--font-sans); font-size:15px; background:var(--surface-2); color:var(--ink); cursor:pointer;}
.select:focus{outline:none; border-color:var(--accent);}
.btn{width:100%; padding:1rem; background:var(--accent); color:var(--bg); border:none; border-radius:6px; font-family:var(--font-sans); font-size:16px; font-weight:600; cursor:pointer; transition:opacity 0.2s;}
.btn:hover{opacity:0.9;}
.btn:active{opacity:0.8;}
.msg{margin-bottom:1.2rem; padding:.75rem; border-radius:6px; font-size:13px; line-height:1.6;}
.msg.err{background:color-mix(in srgb, #B5482B 15%, var(--surface-2)); color:#B5482B;}
.msg.info{background:var(--accent-bg); color:var(--accent);}
.msg.ok{background:color-mix(in srgb, var(--ok) 15%, var(--surface-2)); color:var(--ok);}
.hint{font-size:12px; color:var(--ink-muted); text-align:center; margin-top:1.5rem; line-height:1.6;}
.mode-toggle{text-align:center; margin-bottom:1.5rem;}
.mode-btn{display:inline-block; padding:.4rem .8rem; margin:0 .3rem; background:transparent; border:1px solid var(--border); border-radius:4px; font-size:12px; cursor:pointer; color:var(--ink-2); transition:all 0.2s;}
.mode-btn.active{background:var(--accent); color:var(--bg); border-color:var(--accent);}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🔐</div>
  <h1 class="title">Família Pires</h1>
  <p class="subtitle">Genealogia • Acesso Restrito</p>

  <div id="msg"></div>

  <div class="mode-toggle">
    <button class="mode-btn active" onclick="switchMode('login')">Já tenho senha</button>
    <button class="mode-btn" onclick="switchMode('create')">Primeira entrada</button>
  </div>

  <!-- LOGIN MODE -->
  <div id="login-mode">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="label">Quem é você?</label>
        <select id="username" class="select" required>
          <option value="">Selecione...</option>
          <option value="user">Randolfo</option>
          <option value="pires">Autor</option>
          <option value="fabia">Fábia - Agência</option>
        </select>
      </div>

      <div class="form-group">
        <label class="label" for="password-login">Senha</label>
        <input type="password" id="password-login" class="input" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="btn">Acessar</button>
    </form>
  </div>

  <!-- CREATE MODE -->
  <div id="create-mode" style="display:none;">
    <form onsubmit="handleCreate(event)">
      <div class="form-group">
        <label class="label">Qual é o seu nome?</label>
        <select id="user-create" class="select" required>
          <option value="">Selecione...</option>
          <option value="user">Randolfo</option>
          <option value="pires">Autor</option>
          <option value="fabia">Fábia - Agência</option>
          <option value="teste">🧪 Teste (descarte após)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="label" for="password-new">Crie sua senha</label>
        <input type="password" id="password-new" class="input" placeholder="Crie uma senha forte" required minlength="6">
        <p style="font-size:12px; color:var(--ink-muted); margin:.5rem 0 0;">Mínimo 6 caracteres. Use letras, números e símbolos.</p>
      </div>

      <div class="form-group">
        <label class="label" for="password-confirm">Confirme a senha</label>
        <input type="password" id="password-confirm" class="input" placeholder="Digite novamente" required>
      </div>

      <button type="submit" class="btn">Acessar</button>
    </form>
  </div>

  <p class="hint">Sua sessão é privada ao navegador. Ao fechar, você sairá automaticamente.</p>
</div>

<script src="auth.js"></script>
<script>
function switchMode(mode) {
  document.getElementById('login-mode').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('create-mode').style.display = mode === 'create' ? 'block' : 'none';
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  clearMsg();
}

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.className = `msg ${type}`;
  msg.innerHTML = text;
}

function clearMsg() {
  document.getElementById('msg').innerHTML = '';
}

function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password-login').value;

  if (!AUTH.users[username].hash) {
    showMsg('⚠️ Esta é sua primeira entrada. Vamos criar sua senha.', 'info');
    setTimeout(() => {
      document.getElementById('user-create').value = username;
      switchMode('create');
    }, 800);
    return;
  }

  if (AUTH.validate(username, password)) {
    AUTH.setSession(username);
    showMsg('✓ Bem-vindo! Redirecionando...', 'ok');
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1000);
  } else {
    showMsg('❌ Senha incorreta. Tente novamente.', 'err');
    document.getElementById('password-login').value = '';
  }
}

function handleCreate(e) {
  e.preventDefault();
  const username = document.getElementById('user-create').value;
  const pwd1 = document.getElementById('password-new').value;
  const pwd2 = document.getElementById('password-confirm').value;

  if (pwd1 !== pwd2) {
    showMsg('❌ As senhas não combinam.', 'err');
    return;
  }

  if (pwd1.length < 6) {
    showMsg('❌ A senha deve ter pelo menos 6 caracteres.', 'err');
    return;
  }

  if (AUTH.create(username, pwd1)) {
    showMsg(`✓ Senha criada com sucesso! Faça login para continuar.`, 'ok');
    setTimeout(() => switchMode('login'), 1500);
  } else {
    showMsg('❌ Erro ao criar senha. Tente novamente.', 'err');
  }
}
</script>
</body>
</html>
